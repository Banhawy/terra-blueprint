# terraform-docs settings, used by scripts/generate-docs.sh and pre-commit.
formatter: markdown table

output:
  file: README.md
  mode: inject

sort:
  enabled: true
  by: required

settings:
  anchor: false
  default: true
  hide-empty: true
  html: false
  indent: 3
  lockfile: false
  required: true
  type: true
